<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – eRevs</title>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1923;
      font-family: 'DM Sans', Arial, sans-serif;
      color: #e2e8f0;
    }
    .card {
      background: #1a2535;
      border: 1px solid #2a3a50;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #7a8fa8;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }
    .field { margin-bottom: 1.25rem; }
    .input-wrap {
      display: flex;
      align-items: center;
      background: #0f1923;
      border: 1px solid #2a3a50;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #3b82f6; }
    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.7rem 0.9rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: #4a5a70; }
    .suffix {
      padding: 0.7rem 0.9rem 0.7rem 0;
      color: #4a5a70;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .hint {
      font-size: 0.75rem;
      color: #4a5a70;
      margin-top: 0.3rem;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.8rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #2563eb; }
    button[type="submit"]:disabled { background: #2a3a50; color: #4a5a70; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    #message.error   { background: #2d1a1a; color: #f87171; border: 1px solid #7f1d1d; display: block; }
    #message.success { background: #1a2d1a; color: #4ade80; border: 1px solid #14532d; display: block; }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #7a8fa8;
    }
    .login-link a { color: #3b82f6; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">eRevs</div>
    <div class="subtitle">Create your account</div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="yourname" autocomplete="username" required />
          <span class="suffix">@erevs.com</span>
        </div>
        <div class="hint">Letters and numbers only — no spaces or @ symbol</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" required />
        </div>
      </div>

      <div class="field">
        <label for="veriCode">Verification Code</label>
        <div class="input-wrap">
          <input type="text" id="veriCode" placeholder="5-character code" maxlength="5" autocomplete="off" required />
        </div>
        <div class="hint">Contact your administrator for an access code</div>
      </div>

      <button type="submit" id="submitBtn">Create Account</button>
      <div id="message"></div>
    </form>

    <div class="login-link">Already have an account? <a href="login.html">Sign in</a></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBgBqrrRBB1vvAnQ9mNBt9Vq6p2NWeKYZw",
      authDomain: "revs-2c987.firebaseapp.com",
      projectId: "revs-2c987",
      databaseURL: "https://revs-2c987-default-rtdb.firebaseio.com",
      storageBucket: "revs-2c987.firebasestorage.app",
      messagingSenderId: "181256684157",
      appId: "1:181256684157:web:a9e1c5dfd767658e2ba714",
      measurementId: "G-2050889X0C"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.database();

    const form      = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const msgDiv    = document.getElementById('message');

    function showMsg(text, type) {
      msgDiv.textContent = text;
      msgDiv.className = type;
    }

    // Block @ sign in username field
    document.getElementById('username').addEventListener('input', function() {
      this.value = this.value.replace(/[@\s]/g, '');
    });

    // Auto-uppercase verification code
    document.getElementById('veriCode').addEventListener('input', function() {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msgDiv.className = '';
      msgDiv.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const code     = document.getElementById('veriCode').value.trim().toUpperCase();

      // Validate
      if (!username) return showMsg('Please enter a username.', 'error');
      if (!/^[A-Za-z0-9_.-]+$/.test(username)) return showMsg('Username can only contain letters, numbers, underscores, dots, or hyphens.', 'error');
      if (password.length < 6) return showMsg('Password must be at least 6 characters.', 'error');
      if (code.length !== 5) return showMsg('Verification code must be 5 characters.', 'error');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying…';

      try {
        // Check code in database
        const codeRef  = db.ref('veri/' + code);
        const snapshot = await codeRef.get();

        if (!snapshot.exists()) {
          showMsg('Invalid verification code. Please check and try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        submitBtn.textContent = 'Creating account…';

        // Create Firebase Auth account
        const email = `${username}@erevs.com`;
        await auth.createUserWithEmailAndPassword(email, password);

        // Delete the used code
        await codeRef.remove();

        showMsg('Account created! Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);

      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') msg = 'That username is already taken.';
        if (err.code === 'auth/weak-password') msg = 'Password is too weak.';
        showMsg(msg, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>

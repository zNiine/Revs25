<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – eRevs</title>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1923;
      font-family: 'DM Sans', Arial, sans-serif;
      color: #e2e8f0;
    }
    .card {
      background: #1a2535;
      border: 1px solid #2a3a50;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #7a8fa8;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }
    .field { margin-bottom: 1.25rem; }
    .input-wrap {
      display: flex;
      align-items: center;
      background: #0f1923;
      border: 1px solid #2a3a50;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #3b82f6; }
    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.7rem 0.9rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: #4a5a70; }
    .suffix {
      padding: 0.7rem 0.9rem 0.7rem 0;
      color: #4a5a70;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #2a3a50; color: #4a5a70; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    #message.error   { background: #2d1a1a; color: #f87171; border: 1px solid #7f1d1d; display: block; }
    #message.success { background: #1a2d1a; color: #4ade80; border: 1px solid #14532d; display: block; }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0;
      color: #4a5a70;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a3a50;
    }
    .btn-secondary {
      width: 100%;
      padding: 0.8rem;
      background: transparent;
      color: #94a3b8;
      border: 1px solid #2a3a50;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-secondary:hover {
      background: #2a3a50;
      border-color: #3b82f6;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">eRevs</div>
    <div class="subtitle">Sign in to your account</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="yourname" autocomplete="username" required />
          <span class="suffix">@erevs.com</span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
        </div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
      <div id="message"></div>
    </form>

    <div class="divider">or</div>
    <a href="register.html" class="btn-secondary">Create Account</a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBgBqrrRBB1vvAnQ9mNBt9Vq6p2NWeKYZw",
      authDomain: "revs-2c987.firebaseapp.com",
      projectId: "revs-2c987",
      storageBucket: "revs-2c987.firebasestorage.app",
      messagingSenderId: "181256684157",
      appId: "1:181256684157:web:a9e1c5dfd767658e2ba714",
      measurementId: "G-2050889X0C"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginBtn = document.getElementById('loginBtn');
    const msgDiv   = document.getElementById('message');

    function showMsg(text, type) {
      msgDiv.textContent = text;
      msgDiv.className = type;
    }

    document.getElementById('username').addEventListener('input', function() {
      this.value = this.value.replace(/[@\s]/g, '');
    });

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      msgDiv.className = '';
      msgDiv.style.display = 'none';

      const user = document.getElementById('username').value.trim();
      const pwd  = document.getElementById('password').value;

      if (!user || !pwd) return showMsg('Please enter both username and password.', 'error');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      const email = `${user}@eRevs.com`;
      auth.signInWithEmailAndPassword(email, pwd)
        .then(() => {
          window.location.href = 'index.html';
        })
        .catch(err => {
          let msg = err.message;
          if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(err.code)) {
            msg = 'Incorrect username or password.';
          }
          showMsg(msg, 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        });
    });

    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'index.html';
    });
  </script>
</body>
</html>

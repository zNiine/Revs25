  <header><h1>Stealing Stats Dashboard</h1></header>

  <div class="submenu">
    <button id="btnCount">Attempts By Count</button>
  </div>
  <section id="countSection">
    <div class="filters">
      <label>Batting Team:
        <select id="battingTeamCountFilter"><option value="">All</option></select>
      </label>
    </div>
    <table id="countTable">
      <thead><tr id="countHeader"></tr></thead>
      <tbody id="countBody"></tbody>
    </table>
  </section>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script>
    const stealsUrl='all_steals.csv';
    let stealRows=[];

    function cleanName(n){return typeof n==='string'?n.replace(/\s*\d.*$/,'').trim():'';}  
    function makeSortable(id,body){document.querySelectorAll(`#${id} th`).forEach((th,i)=>th.onclick=()=>{const tb=document.getElementById(body),rows=Array.from(tb.rows),asc=th.asc=!th.asc;rows.sort((a,b)=>{const x=a.cells[i].innerText,y=b.cells[i].innerText,nx=parseFloat(x),ny=parseFloat(y),cmp=(isNaN(nx)||isNaN(ny)?x.localeCompare(y):nx-ny);return asc?cmp:-cmp;});tb.innerHTML='';rows.forEach(r=>tb.appendChild(r));});}

    function populateCountFilters(){const Bc=document.getElementById('battingTeamCountFilter');Bc.innerHTML='';Bc.append(new Option('All',''));new Set(stealRows.map(s=>s.batting_team)).forEach(t=>Bc.append(new Option(t,t)));}

    function renderCount(){
      const B = document.getElementById('battingTeamCountFilter').value;
      const allCounts = [...new Set(stealRows.map(s => `${s.balls}-${s.strikes}`))]
        .sort((a,b)=>{const [aB,aS]=a.split('-').map(Number),[bB,bS]=b.split('-').map(Number);return aB!==bB?aB-bB:aS-bS;});

      const playerStats = {};
      stealRows.filter(s=>!B||s.batting_team===B).forEach(s=>{
        const p=cleanName(s.player), cnt=`${s.balls}-${s.strikes}`;
        playerStats[p]=playerStats[p]||{};
        playerStats[p][cnt]=playerStats[p][cnt]||0;
        playerStats[p][cnt]++;
      });

      // compute max
      let maxVal=0;
      Object.values(playerStats).forEach(counts=>{Object.values(counts).forEach(v=>{if(v>maxVal)maxVal=v;});});

      // header
      const hdr=['Runner',...allCounts,'Total'];
      document.getElementById('countHeader').innerHTML=hdr.map(h=>`<th>${h}</th>`).join('');

      // body
      let html='';
      Object.entries(playerStats).forEach(([p,counts])=>{
        let tot=0;
        html+=`<tr><td>${p}</td>`;
        allCounts.forEach(cnt=>{
          const v=counts[cnt]||0;
          tot+=v;
          const ratio = maxVal? v / maxVal : 0;
          const gb = Math.round(255 * (1 - ratio));
          html += `<td style="background:rgb(255,${gb},${gb})">${v}</td>`;
        });
        html+=`<td>${tot}</td></tr>`;
      });
      const teamTotals = allCounts.map(cnt => Object.values(playerStats).reduce((acc, counts) => acc + (counts[cnt] || 0), 0));
      const teamSum = teamTotals.reduce((a, b) => a + b, 0);
      const teamMax = teamTotals.length? Math.max(...teamTotals):0;

      html += `<tr><td><strong>Team Total</strong></td>`;
      teamTotals.forEach(v => {const ratio = teamMax? v / teamMax:0; const gb = Math.round(255 * (1 - ratio)); html += `<td style="background:rgb(255,${gb},${gb})"><strong>${v}</strong></td>`;});
      html += `<td><strong>${teamSum}</strong></td></tr>`;

      document.getElementById('countBody').innerHTML=html;
      makeSortable('countTable','countBody');
    }
    document.getElementById('btnCount').onclick=()=>{document.getElementById('countSection').classList.remove('hidden');};

    fetch(stealsUrl).then(r=>r.text()).then(t=>Papa.parse(t,{header:true}).data).then(s=>{stealRows=s;stealRows.forEach(s=>{s.batting_team=s.batting_team||s.BattingTeam||'';});populateCountFilters();document.getElementById('battingTeamCountFilter').addEventListener('change',renderCount);renderCount();});
  </script>

<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Show — Operator</title>
<style>
  :root { --bg:#0b0b0f; --card:#14141a; --fg:#fff; --muted:#9aa3b2; --accent:#69f; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto}
  .wrap{max-width:920px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  h1{font-size:22px;margin:0 0 8px}
  h2{font-size:16px;margin:0 0 10px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a34;background:#0f0f14;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button{padding:12px;border:0;border-radius:12px;background:#2b3140;color:#fff;font-weight:600;cursor:pointer; display: flex; align-items: center; justify-content: center; gap: 8px;}
  button.accent{background:var(--accent);color:#000}
  button.warn{background:#f66;color:#000}
  .stat{font:12px/1.2 system-ui;color:var(--muted)}
  .flex{display:flex;gap:10px;align-items:center}
  .stack{display:grid;gap:10px}
  .kbd{background:#000;padding:2px 6px;border-radius:6px;border:1px solid #333;color:#aaa}
  pre { white-space:pre-wrap; }
</style>
<body>
<div class="wrap">
  <div class="row">
    <div class="card">
      <h1>Operator Panel</h1>
      <div class="stat" id="status">–</div>
      <div class="stack" style="margin-top:8px">
        <label>Show ID</label>
        <input id="showId" value="sweet-caroline" />
        <div class="grid">
          <button id="loadShow">Load</button>
          <button id="saveMeta">Save Meta</button>
          <button id="resetShow" class="warn">Reset t0</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="stack">
          <h2>Meta</h2>
          <label>Title</label>
          <input id="title" placeholder="Sweet Caroline">
          <label>BPM</label>
          <input id="bpm" type="number" min="40" max="220" value="126">
          <label>Bars</label>
          <input id="bars" type="number" min="1" max="256" value="64">
        </div>
      </div>
    </div>

    <div class="card">
      <h1>Live Cues</h1>
      <div class="stack">
        <button id="startSongNow" class="accent">Start Show</button>
        <div class="stat" style="font-size: 1.25em; text-align: center; margin-top: 10px;">
          Show Progress: <span id="songTimer">0s</span>
        </div>
        <div class="grid">
          <button id="blastNow">Blast now</button>
          <button id="whiteOut4">Whiteout 1 beat</button>
          <button id="strobe2s">Strobe 2s @ 8 Hz</button>
        </div>
        <div class="grid">
          <button id="torchOn">Torch ON</button>
          <button id="torchOff">Torch OFF</button>
          <button id="stopNow" class="warn">Stop Now</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h1>Debug / Time</h1>
      <div class="stat" id="timeInfo">–</div>
      <pre class="stat" id="currShow">–</pre>
    </div>
  </div>
</div>

<script type="module">
/* ===========================================
   OPERATOR — v3.4 (Manual cueing without player)
   =========================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js';
import { getDatabase, ref, get, set, update, onValue } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js';

console.log("[O1] Operator script start.");

const firebaseConfig = {
  apiKey: "AIzaSyBgBqrrRBB1vvAnQ9mNBt9Vq6p2NWeKYZw",
  authDomain: "revs-2c987.firebaseapp.com",
  projectId: "revs-2c987",
  storageBucket: "revs-2c987.appspot.com",
  messagingSenderId: "181256684157",
  appId: "1:181256684157:web:a9e1c5dfd767658e2ba714",
  measurementId: "G-2050889X0C",
  databaseURL: "https://revs-2c987-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
console.log("[O2] Firebase app initialized.");
const db  = getDatabase(app);
console.log("[O3] RTDB handle created.");

const el = id => document.getElementById(id);
const showId   = el('showId');
const status   = el('status');
const title    = el('title');
const bpm      = el('bpm');
const bars     = el('bars');
const timeInfo = el('timeInfo');
const currShow = el('currShow');

const startSongBtn = el('startSongNow');
const songTimer = el('songTimer');

let timerInterval = null;

console.log("[O4] DOM bound.");

// Server time
const offsetRef = ref(db, '.info/serverTimeOffset');
let serverOffset = 0;
onValue(offsetRef, snap => { serverOffset = snap.val()|0; });
const serverNow = () => Date.now() + serverOffset;

function sref(path){ return ref(db, path); }
function logStatus(t){ status.textContent = t; console.log("[STATUS]", t); }

async function loadShow(){
  const id = showId.value.trim();
  console.log("[O6] loadShow(%s)", id);
  const snap = await get(sref(`shows/${id}`));
  if (!snap.exists()) {
    logStatus('No show doc; creating with Save Meta…');
    await saveMeta();
    return;
  }
  const s = snap.val();
  console.log("[O7] Loaded show:", s);
  title.value = s.title ?? '';
  bpm.value   = s?.tempo?.bpm ?? 126;
  bars.value  = s?.grid?.bars ?? 64;
  renderShow(s);
}

function renderShow(s){
  const info = {
    t0: s.t0 || 0,
    title: s.title || '',
    bpm: s?.tempo?.bpm,
    bars: s?.grid?.bars,
    patterns: (s.patterns||[]).length
  };
  currShow.textContent = JSON.stringify(info, null, 2);
  console.log("[O8] renderShow:", info);
}

onValue(sref(`shows/${showId.value}`), snap=>{
  if (snap.exists()) {
    console.log("[O9] shows value event.");
    renderShow(snap.val());
  }
});

async function saveMeta(){
  const id = showId.value.trim();
  console.log("[O10] saveMeta(%s)", id);
  const payload = {
    title: title.value || 'Untitled',
    tempo: { bpm: Number(bpm.value||126), ts: "4/4" },
    grid: { mode: "bpm", bars: Number(bars.value||64) }
  };
  await update(sref(`shows/${id}`), payload);
  logStatus('Meta saved.');
}

async function setT0(ms){
  const id = showId.value.trim();
  console.log("[O11] setT0(%d)", ms);
  await update(sref(`shows/${id}`), { t0: ms });
}

async function resetT0(){
  const id = showId.value.trim();
  console.log("[O12] resetT0()");
  await update(sref(`shows/${id}`), { t0: 0 });
}

async function setPatterns(arr){
  const id = showId.value.trim();
  console.log("[O14] setPatterns len=%d", arr.length);
  await update(sref(`shows/${id}`), { patterns: arr });
  logStatus(`Patterns: ${arr.length}`);
}

async function torchCommand(atMs, on){
  const id = showId.value.trim();
  console.log("[O15] torchCommand at=%d on=%s", atMs, on);
  await set(sref(`shows/${id}/liveTorch`), { type:'torch', at: atMs, on: !!on, atClient: serverNow() });
}

// === LIGHT SHOW PATTERNS ===
// This section contains pre-programmed sequences of light patterns.

function chorusPreset(){
  console.log("[O16] chorusPreset()");
  return [
    { atBeat: 21, type:'strobe', hz:8, duty:0.35, lenBeats: 4 },
    { atBeat: 25, type:'blast',  lenBeats: 1 },
    { atBeat: 26, type:'blast',  lenBeats: 1 },
    { atBeat: 27, type:'blast',  lenBeats: 1 },
    { atBeat: 28, type:'strobe', hz:6, duty:0.30, lenBeats: 4 }
  ];
}

/**
 * Generates a full light show pattern for "Sweet Caroline" (approx. 3:23).
 * Uses a BPM of 126.
 */
function sweetCarolineFullShow() {
  console.log("[O29] Generating full show patterns.");
  const patterns = [];
  const bpmVal = 126;

  // Function to convert minutes:seconds to beats, rounded to 2 decimal places
  const timeToBeat = (minutes, seconds) => Math.round(((minutes * 60) + seconds) * bpmVal / 60);

  // Intro: 0:00 - 0:13 (build-up)
  const introEndBeat = timeToBeat(0, 13);
  // Slower, pulsing build-up
  patterns.push({ atBeat: 0, type: 'strobe', hz: 1.5, duty: 0.5, lenBeats: 4 });
  patterns.push({ atBeat: 4, type: 'strobe', hz: 2, duty: 0.5, lenBeats: 4 });
  patterns.push({ atBeat: 8, type: 'strobe', hz: 4, duty: 0.5, lenBeats: 5 }); // Faster build up to verse
  patterns.push({ atBeat: 13, type: 'blast', lenBeats: 0.5 }); // Punctuate the start of the verse

  // Verse 1: 0:13 - 0:40 ("Where it began...")
  const verse1StartBeat = timeToBeat(0, 13);
  const verse1EndBeat = timeToBeat(0, 40);
  // Rhythmic blasts that follow the acoustic guitar
  for(let beat = verse1StartBeat; beat < verse1EndBeat; beat += 1) {
    patterns.push({ atBeat: beat, type: 'blast', lenBeats: 0.1 });
    if (beat % 4 === 0) { // On the downbeat of each bar
      patterns.push({ atBeat: beat, type: 'torch', on: true, lenBeats: 0.25 });
    }
  }

  // Chorus 1: 0:40 - 1:04 ("Sweet Caroline...")
  const chorus1StartBeat = timeToBeat(0, 40);
  const chorus1EndBeat = timeToBeat(1, 4);
  // High energy strobes and blasts
  for(let beat = chorus1StartBeat; beat < chorus1EndBeat; beat += 1) {
      patterns.push({ atBeat: beat, type: 'blast', lenBeats: 0.1 });
      patterns.push({ atBeat: beat + 0.5, type: 'strobe', hz: 10, duty: 0.5, lenBeats: 0.5 });
  }

  // Verse 2: 1:04 - 1:28 ("Hands, touching hands...")
  const verse2StartBeat = timeToBeat(1, 4);
  const verse2EndBeat = timeToBeat(1, 28);
  // Different rhythmic pattern for the second verse
  for(let beat = verse2StartBeat; beat < verse2EndBeat; beat += 2) {
    patterns.push({ atBeat: beat, type: 'blast', lenBeats: 0.2 });
    patterns.push({ atBeat: beat + 1, type: 'strobe', hz: 4, duty: 0.5, lenBeats: 0.5 });
  }

  // Chorus 2: 1:28 - 1:52 ("Sweet Caroline...")
  const chorus2StartBeat = timeToBeat(1, 28);
  const chorus2EndBeat = timeToBeat(1, 52);
  // Same high energy as Chorus 1
  for(let beat = chorus2StartBeat; beat < chorus2EndBeat; beat += 1) {
      patterns.push({ atBeat: beat, type: 'blast', lenBeats: 0.1 });
      patterns.push({ atBeat: beat + 0.5, type: 'strobe', hz: 10, duty: 0.5, lenBeats: 0.5 });
  }

  // Bridge: 1:52 - 2:20 ("Now I...")
  const bridgeStartBeat = timeToBeat(1, 52);
  const bridgeEndBeat = timeToBeat(2, 20);
  // Escalating blasts to build tension
  for(let beat = bridgeStartBeat; beat < bridgeEndBeat; beat += 4) {
    patterns.push({ atBeat: beat, type: 'blast', lenBeats: 1 });
  }
  for(let beat = bridgeStartBeat + 1; beat < bridgeEndBeat; beat += 4) {
    patterns.push({ atBeat: beat, type: 'strobe', hz: 8, duty: 0.5, lenBeats: 1 });
  }
  // Intense flash at the climax of the bridge
  patterns.push({ atBeat: bridgeEndBeat - 2, type: 'strobe', hz: 16, duty: 0.75, lenBeats: 2 });
  patterns.push({ atBeat: bridgeEndBeat, type: 'blast', lenBeats: 1 });

  // Final Choruses / Outro: 2:20 - End
  const finalChorusStartBeat = timeToBeat(2, 20);
  const songEndBeat = timeToBeat(3, 23);
  
  // Repeating "bum bum bum" pattern with syncopated blasts
  for (let i = 0; i < 6; i++) {
    const startBeat = finalChorusStartBeat + (i * 12);
    patterns.push({ atBeat: startBeat, type: 'blast', lenBeats: 0.5 });
    patterns.push({ atBeat: startBeat + 2, type: 'strobe', hz: 12, duty: 0.5, lenBeats: 1.5 });
    patterns.push({ atBeat: startBeat + 4, type: 'blast', lenBeats: 0.5 });
    patterns.push({ atBeat: startBeat + 6, type: 'strobe', hz: 12, duty: 0.5, lenBeats: 1.5 });
    patterns.push({ atBeat: startBeat + 8, type: 'blast', lenBeats: 0.5 });
    patterns.push({ atBeat: startBeat + 10, type: 'strobe', hz: 12, duty: 0.5, lenBeats: 1.5 });
  }

  // "Good times never seemed so good" escalation
  const goodTimesStartBeat = timeToBeat(2, 45);
  const goodTimesEndBeat = timeToBeat(3, 5);
  for (let beat = goodTimesStartBeat; beat < goodTimesEndBeat; beat += 0.5) {
    patterns.push({ atBeat: beat, type: 'blast', lenBeats: 0.1 });
  }
  for (let beat = goodTimesEndBeat; beat < songEndBeat; beat += 0.25) {
    patterns.push({ atBeat: beat, type: 'strobe', hz: 20, duty: 0.5, lenBeats: 0.25 });
  }

  // Final big blast
  patterns.push({ atBeat: songEndBeat, type: 'blast', lenBeats: 1 });
  patterns.push({ atBeat: songEndBeat + 1, type: 'torch', on: false, lenBeats: 0.1 });


  return patterns;
}

async function pushFullShow(){
  console.log("[O30] pushFullShow()");
  await setPatterns(sweetCarolineFullShow());
  logStatus('Full show loaded');
}

// Bindings
document.getElementById('loadShow').onclick = loadShow;
document.getElementById('saveMeta').onclick = saveMeta;
document.getElementById('resetShow').onclick = async ()=>{
  await resetT0();
  logStatus('t0 cleared');
};

startSongBtn.onclick = async () => {
  console.log("[O31] startSongNow() clicked");
  startSongBtn.disabled = true;
  let countdown = 3;
  const originalText = startSongBtn.textContent;
  const countdownInterval = setInterval(() => {
    if (countdown > 0) {
      startSongBtn.textContent = `${countdown}...`;
      countdown--;
    } else {
      clearInterval(countdownInterval);
      startSongBtn.textContent = originalText;
      logStatus('Starting show…');
      
      pushFullShow().then(() => {
        const t0 = serverNow();
        setT0(t0);
        // Start the song timer
        timerInterval = setInterval(() => {
          const elapsedSeconds = Math.round((serverNow() - t0) / 1000);
          songTimer.textContent = `${elapsedSeconds}s`;
        }, 1000);
      });
    }
  }, 1000);
};

document.getElementById('stopNow').onclick = async ()=>{
  console.log("[O27] stopNow()");
  clearInterval(timerInterval);
  songTimer.textContent = '0s';
  startSongBtn.disabled = false;
  await setPatterns([]);
  logStatus('Stopped');
};

document.getElementById('blastNow').onclick = async ()=>{
  console.log("[O22] blastNow()");
  await setPatterns([{ atMs: 0, type: 'blast', lenBeats:1 }]); // marker for logs
  const at = serverNow();
  await torchCommand(at, true);
  setTimeout(()=>torchCommand(serverNow(), false), 120);
};

document.getElementById('whiteOut4').onclick = async ()=>{
  console.log("[O23] whiteOut4()");
  const at = serverNow();
  await torchCommand(at, true);
  setTimeout(()=>torchCommand(serverNow(), false), 480);
};

document.getElementById('strobe2s').onclick = async ()=>{
  console.log("[O24] strobe2s()");
  const id = showId.value.trim();
  const s = await get(sref(`shows/${id}`));
  const show = s.val() || {};
  const t0 = show.t0 || serverNow();
  const rel = Math.max(0, serverNow() - t0);
  const arr = (show.patterns || []).slice();
  const bpmVal = Number(bpm.value||126);
  const beatsIn2s = Math.max(1, Math.round(2 / (60000/bpmVal)));
  arr.push({ atMs: rel, type:'strobe', hz:8, duty:0.35, lenBeats: beatsIn2s });
  await setPatterns(arr);
};

document.getElementById('torchOn').onclick  = ()=>{ console.log("[O25] torchOn()");  torchCommand(serverNow(), true); };
document.getElementById('torchOff').onclick = ()=>{ console.log("[O26] torchOff()"); torchCommand(serverNow(), false); };

// Time ticker
setInterval(()=>{
  timeInfo.textContent = `Local: ${new Date().toLocaleTimeString()} | Δserver≈${serverOffset}ms | ServerNow: ${new Date(serverNow()).toISOString()}`;
}, 500);

// Boot
document.addEventListener('DOMContentLoaded', () => {
    loadShow().then(() => console.log("[O28] Initial loadShow() done."));
});
</script>
</body>
</html>

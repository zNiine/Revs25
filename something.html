<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diamond 9-Zone (4 IF + 5 OF)</title>
<style>
  :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --stroke:#334155; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background: radial-gradient(1200px 800px at 65% -20%, #1e293b 0, #0b1220 50%, var(--bg) 100%);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:var(--text);
  }
  .panel{ width:min(820px,92vw); background:linear-gradient(180deg,#0d1320,var(--card));
    border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    padding:20px 20px 26px;
  }
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  header h1{ font-size:18px; margin:0; letter-spacing:.4px; font-weight:600; color:#f8fafc; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button,select{
    background:#0b1220; color:var(--text); border:1px solid #1f2a44; padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:600;
  }
  button:hover{ border-color:#2b3b63; }
  .legend{ display:flex; gap:12px; align-items:center; margin-top:10px; font-size:12px; color:var(--muted); }
  .gradBar{ height:8px; width:160px; border-radius:999px; border:1px solid #27324a;
    background:linear-gradient(90deg,#114a9c,#98a9c9,#e9b4b8,#9b1b1b);
  }
  .tip{ color:var(--muted); font-size:12px; margin-top:10px; }

  .slice{ transition:transform .15s ease, opacity .15s ease; }
  .slice:hover{ opacity:.92; transform:scale(1.012); }

  .pill{ fill:rgba(255,255,255,.92); stroke:rgba(0,0,0,.08); }
  .pillText{ fill:#0b1220; font-weight:800; font-size:12px; letter-spacing:.2px; pointer-events:none; }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <h1>Diamond 9-Zone (4 IF + 5 OF)</h1>
      <div class="controls">
        <select id="palette">
          <option value="blue-red" selected>Blue → Red</option>
          <option value="coolwarm">Coolwarm</option>
          <option value="greens">Greens</option>
          <option value="fire">Fire</option>
        </select>
        <button id="randomize">Randomize</button>
        <button id="reset">Reset</button>
      </div>
    </header>

        <svg id="chart" viewBox="-250 -250 500 500" width="100%" height="auto" aria-label="Diamond nine-zone chart">
      <g id="root" transform="rotate(-45)">
                <path d="M0,0 L200,120 0,260 -200,120 Z" fill="none" stroke="#1f2a44" stroke-width="2.5"/>
        <g id="slices"></g>
        <g id="labels"></g>
      </g>
    </svg>

    <div class="legend"><span>Low</span><div class="gradBar"></div><span>High</span></div>
    <div class="tip">
      Values: [IF-L, IF-U, IF-R, IF-D, OF-L, OF-LU, OF-U, OF-RU, OF-R]. Click a slice to log it.
      Use <code>updateZones([...])</code> to set values.
    </div>
  </div>

<script>
/* -------- Config: 4 infield (inner) + 5 outfield (outer) -------- */
const cfg = {
  spreadDeg: 360,          // full fan
  gapDeg: 0,              // visual separator between slices
  rings: [
    { r0:   0, r1: 150, sectors: 4 },  // INFIELD: reaches the tip (home)
    { r0: 150, r1: 240, sectors: 5 }   // OUTFIELD
  ]
};

// Demo values in the order documented above:
const values = [20, 35, 10, 0, 7, 14, 54, 18, 7];

/* -------- Utilities -------- */
const rad = d => d * Math.PI / 180;
function polarToXY(r, aDeg){ const a=rad(aDeg); return [r*Math.cos(a), r*Math.sin(a)]; }
function colorScale(v, palette){
  const t=Math.max(0,Math.min(1,v/100));
  switch(palette){
    case 'greens': return `hsl(140 ${65+25*t}% ${22+40*t}%)`;
    case 'coolwarm':{ const h=210+(12-210)*t, s=55+(80-55)*t, l=32+(56-32)*t; return `hsl(${h} ${s}% ${l}%)`; }
    case 'fire': if(t<.5){const k=t/.5;return `hsl(${220-40*k} ${60+10*k}% ${22+10*k}%)`;}
                 else{const k=(t-.5)/.5;return `hsl(${30-20*k} 80% ${42+8*k}%)`;}
    default:{ const h=210-210*t, s=60+10*t, l=28+24*t; return `hsl(${h} ${s}% ${l}%)`; }
  }
}
function roundedRectPath(x,y,w,h,r){
  const x0=x-w/2,y0=y-h/2,x1=x+w/2,y1=y+h/2; r=Math.min(r,w/2,h/2);
  return `M ${x0+r} ${y0} H ${x1-r} A ${r} ${r} 0 0 1 ${x1} ${y0+r} V ${y1-r}
          A ${r} ${r} 0 0 1 ${x1-r} ${y1} H ${x0+r} A ${r} ${r} 0 0 1 ${x0} ${y1-r}
          V ${y0+r} A ${r} ${r} 0 0 1 ${x0+r} ${y0} Z`;
}

/* -------- Build -------- */
const svgSlices = document.getElementById('slices');
const svgLabels = document.getElementById('labels');

function buildChart(){
  svgSlices.innerHTML=''; svgLabels.innerHTML='';
  const startAngle = -cfg.spreadDeg/2, endAngle = cfg.spreadDeg/2;

  let idx=0;
  cfg.rings.forEach((ring,rIdx)=>{
    const span = (endAngle - startAngle) / ring.sectors;
    for(let i=0;i<ring.sectors;i++){
      const a0 = startAngle + i*span + cfg.gapDeg/2;
      const a1 = startAngle + (i+1)*span - cfg.gapDeg/2;

      const p0=polarToXY(ring.r0,a0), p1=polarToXY(ring.r0,a1);
      const p2=polarToXY(ring.r1,a1), p3=polarToXY(ring.r1,a0);
      const d = `M ${p0[0]} ${p0[1]} L ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]} Z`;

      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',d); path.setAttribute('class','slice'); path.setAttribute('data-index',idx);
      path.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--stroke'));
      path.setAttribute('stroke-width', rIdx===0?1.8:1.5);
      path.addEventListener('click',()=>console.log(`Slice ${idx}: ${path.getAttribute('data-value')}%`));
      svgSlices.appendChild(path);

      // label
      const ac=(a0+a1)/2, rc=ring.r0+(ring.r1-ring.r0)*0.58;
      const [cx,cy]=polarToXY(rc,ac);
      const pill=document.createElementNS('http://www.w3.org/2000/svg','path');
      pill.setAttribute('d', roundedRectPath(cx,cy,46,22,7));
      pill.setAttribute('class','pill'); pill.setAttribute('opacity','.92');
      svgLabels.appendChild(pill);

      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',cx); t.setAttribute('y',cy+4);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','pillText');
      t.setAttribute('data-index',idx); t.textContent='0 %';
      svgLabels.appendChild(t);

      idx++;
    }
  });

  applyValues(values);
}

function applyValues(arr){
  const palette=document.getElementById('palette').value;
  const paths=svgSlices.querySelectorAll('.slice');
  const texts=svgLabels.querySelectorAll('text');
  paths.forEach((p,i)=>{ const v=arr[i]??0; p.setAttribute('fill', colorScale(v,palette)); p.setAttribute('data-value',v); });
  texts.forEach((t,i)=>{ const v=arr[i]??0; t.textContent=`${v} %`; });
}

/* -------- Public API -------- */
window.updateZones = function(newValues){
  if(!Array.isArray(newValues) || newValues.length!==9){
    console.warn('updateZones([...]) expects 9 numbers in order: [IF-L,IF-U,IF-R,IF-D,OF-L,OF-LU,OF-U,OF-RU,OF-R]');
    return;
  }
  applyValues(newValues.map(v=>Math.round(Number(v)||0)));
};

/* -------- Controls -------- */
document.getElementById('randomize').addEventListener('click',()=>{
  updateZones(Array.from({length:9},()=>Math.round(Math.random()*100)));
});
document.getElementById('reset').addEventListener('click',()=>{
  updateZones([20,35,10,0, 7,14,54,18,7]);
});
document.getElementById('palette').addEventListener('change',()=>{
  applyValues(Array.from(svgSlices.querySelectorAll('.slice')).map(p=>+p.getAttribute('data-value')||0));
});

/* init */
buildChart();
</script>
</body>
</html>
